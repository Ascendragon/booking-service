services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${LOCAL_UID:-1000}
        GID: ${LOCAL_GID:-1000}

    volumes:
      - .:/var/www

    environment:
      PHP_IDE_CONFIG: "serverName=highload-booking"
      XDEBUG_MODE: "${XDEBUG_MODE:-debug,develop}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    working_dir: /var/www

    init: true

    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - .:/var/www:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - php

  mysql:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: booking
      MYSQL_USER: booking
      MYSQL_PASSWORD: booking
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
